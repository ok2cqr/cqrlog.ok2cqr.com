name: Website

# The page is rebuilt from the GitHub releases of ok2cqr/cqrlog, so a new
# release shows up without touching this repository:
#  * every hour (also catches the macOS DMG uploaded after the release),
#  * right away when a release is published in ok2cqr/cqrlog
#    (.github/workflows/06-website.yml there sends a 'cqrlog-release' dispatch),
#  * on a push here and by hand (Actions -> Website -> Run workflow).
#
# The built site is committed to the gh-pages branch, which GitHub Pages
# serves. Only a change of the content makes a commit, and every commit is a
# new Pages build. (actions/deploy-pages identifies a deployment by the commit
# of this repository, so a rebuild for a new release without a new commit here
# kept serving the previous deployment.)

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [ cqrlog-release ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: python3 -m unittest test_build

      - name: Build
        run: python3 build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish to gh-pages
        run: |
          echo cqrlog.ok2cqr.com > dist/CNAME
          touch dist/.nojekyll
          old=$(git fetch -q --depth=1 origin gh-pages && git rev-parse 'FETCH_HEAD^{tree}' || true)
          cd dist
          git init -q -b gh-pages
          git add -A
          if [ "$(git write-tree)" = "$old" ]; then
            echo "No change, not publishing"
            exit 0
          fi
          version=$(grep -o -m1 'Version [0-9.]*' index.html)
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "CQRLOG website, $version (${{ github.event_name }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Published $version"
